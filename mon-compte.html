<head>

<link rel="stylesheet" href="styles.css?v=7">
<style>
  :root {
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body { font-family: var(--sans); }
  h1,h2,h3,h4 { font-family: var(--serif); }
  .navbar.pill-nav { background: transparent; border-bottom: none; position: sticky; top: 14px; z-index: 50; }
  .navbar.pill-nav .nav-inner { max-width: 1340px; margin: 16px auto 0; background: #fff; border-radius: 999px; padding: 12px 16px 12px 28px; box-shadow: 0 6px 24px -10px rgba(59,31,14,.18); }
  .navbar.pill-nav .nav-links { font-weight: 600; }
  .navbar.pill-nav .nav-links a { color: var(--brown-deep); }
  .navbar.pill-nav .nav-actions { background: transparent; border-radius: 0; padding: 0; gap: 8px; }
  .navbar.pill-nav .icon-btn { width: 40px; height: 40px; background: #EDEFE5; border-radius: 999px; }
  .cart-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 12px; background: #EDEFE5; color: var(--brown-deep); font-weight: 700; font-size: 13px; border-radius: 999px; border: none; cursor: pointer; }
  .cart-pill svg { width: 18px; height: 18px; }
  .promo-bar.pill { max-width: 1340px; margin: 14px auto 0; border-radius: 999px; }

  .account-page { max-width: 1340px; margin: 0 auto; padding: 0 24px 96px; }
  .account-hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px; align-items: stretch; margin: 36px 0 28px; }
  .account-hero__intro, .account-hero__summary { background: #fff; border-radius: 30px; box-shadow: 0 8px 30px -16px rgba(59,31,14,.18); padding: 34px 36px; }
  .account-hero__eyebrow, .section-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--brown-chest); font-weight: 700; }
  .account-hero__title { font-size: clamp(34px, 4vw, 56px); line-height: 1.02; color: var(--brown-deep); margin: 14px 0 12px; letter-spacing: -.02em; }
  .account-hero__title em { color: var(--brown-chest); font-weight: 600; }
  .account-hero__text { font-family: 'Caveat', cursive; font-size: 24px; color: var(--brown-chest); line-height: 1.25; max-width: 560px; }
  .account-hero__meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .meta-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--cream-soft); padding: 10px 14px; border-radius: 999px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--brown-chest); }
  .account-hero__summary { display: grid; gap: 16px; background: linear-gradient(135deg, #4b2517 0%, #6f3926 100%); color: #fff; }
  .account-hero__summary h2 { margin: 0; font-size: 26px; }
  .summary-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .summary-stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 16px; }
  .summary-stat__label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.74); }
  .summary-stat__value { display: block; margin-top: 10px; font-size: 26px; font-weight: 700; }
  .summary-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .summary-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; text-decoration: none; font-weight: 700; cursor: pointer; }
  .summary-btn--ghost { background: transparent; }

  .account-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; align-items: start; }
  .account-card { background: #fff; border-radius: 26px; box-shadow: 0 4px 22px -12px rgba(59,31,14,.18); padding: 28px; }
  .account-card + .account-card { margin-top: 24px; }
  .section-title { margin: 8px 0 8px; font-size: 30px; color: var(--brown-deep); letter-spacing: -.02em; }
  .section-sub { margin: 0 0 22px; color: var(--ink-soft); font-size: 14px; line-height: 1.55; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .span2 { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--mono); }
  .form-control { border: 1.5px solid #e0ded7; border-radius: 12px; padding: 12px 14px; background: #fdfcfb; color: var(--brown-deep); font-size: 14px; width: 100%; box-sizing: border-box; }
  .form-control[readonly] { background: #f2efe9; color: #7b6a61; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn-account { border: none; border-radius: 999px; padding: 12px 18px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .btn-account--primary { background: var(--brown-deep); color: #fff; }
  .btn-account--secondary { background: #efe7dd; color: var(--brown-deep); }
  .inline-message { min-height: 20px; font-size: 13px; margin-top: 12px; }
  .inline-message.error { color: #b4382b; }
  .inline-message.success { color: #1d7a4c; }

  .address-stack { display: grid; gap: 16px; }
  .address-box { background: var(--cream-soft); border-radius: 18px; padding: 18px 20px; }
  .address-box__title { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brown-chest); font-weight: 700; margin-bottom: 10px; }
  .address-box__name { font-weight: 700; color: var(--brown-deep); margin-bottom: 6px; }
  .address-box__line { color: var(--ink-soft); font-size: 14px; line-height: 1.5; }

  .orders-list { display: grid; gap: 14px; }
  .order-item { border: 1px solid #eee3d7; border-radius: 20px; overflow: hidden; }
  .order-item__head { display: flex; justify-content: space-between; gap: 16px; padding: 18px 20px; align-items: center; background: #fcfaf7; }
  .order-item__ref { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brown-chest); font-weight: 700; }
  .order-item__date { margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
  .order-item__status { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: #efe7dd; color: var(--brown-deep); }
  .order-item__body { padding: 18px 20px 20px; }
  .order-item__totals { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 16px; }
  .order-item__total { font-size: 14px; color: var(--ink-soft); }
  .order-item__total strong { color: var(--brown-deep); }
  .order-products { display: grid; gap: 10px; }
  .order-product { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
  .order-product__img { width: 52px; height: 52px; border-radius: 12px; background: var(--cream-soft) center/cover no-repeat; }
  .order-product__name { font-size: 14px; font-weight: 700; color: var(--brown-deep); }
  .order-product__meta { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .order-product__price { font-size: 14px; font-weight: 700; color: var(--brown-deep); }
  .tracking-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; font-weight: 700; color: var(--brown-chest); text-decoration: none; }
  .empty-state { border-radius: 22px; background: #f8f3ec; padding: 28px; color: var(--ink-soft); }
  .loading-state { padding: 80px 0; text-align: center; color: var(--muted); }

  @media (max-width: 980px) {
    .account-hero, .account-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .navbar.pill-nav { top: 0; }
    .navbar.pill-nav .nav-inner { margin: 0 auto; border-radius: 0 0 22px 22px; padding: 10px 14px 10px 18px; }
    .promo-bar.pill { margin: 0; border-radius: 0; }
    .account-page { padding: 0 16px 80px; }
    .account-hero__intro, .account-hero__summary, .account-card { padding: 24px; }
  }
  @media (max-width: 560px) {
    .form-grid, .summary-stats { grid-template-columns: 1fr; }
    .order-item__head, .order-product { grid-template-columns: 1fr; }
    .order-product__img { width: 64px; height: 64px; }
  }
</style>
</head>

<script>
(function () {
  var root = document.getElementById('account-root');

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
    });
  }

  function fmtCurrency(value) {
    var amount = Number(value || 0);
    return amount.toFixed(2).replace('.', ',') + ' €';
  }

  function fmtDate(value) {
    if (!value) return '—';
    var date = new Date(value);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function addressHtml(address, emptyLabel) {
    if (!address) {
      return '<div class="address-box__line">' + escapeHtml(emptyLabel) + '</div>';
    }
    var lines = [];
    if (address.address) lines.push(address.address);
    if (address.addressExtra) lines.push(address.addressExtra);
    var cityLine = [address.zipcode, address.city].filter(Boolean).join(' ');
    if (cityLine) lines.push(cityLine);
    if (address.country) lines.push(address.country);
    return ''
      + (address.name ? '<div class="address-box__name">' + escapeHtml(address.name) + '</div>' : '')
      + lines.map(function (line) { return '<div class="address-box__line">' + escapeHtml(line) + '</div>'; }).join('')
      + (address.carrier ? '<div class="address-box__line">Transporteur : ' + escapeHtml(address.carrier) + '</div>' : '');
  }

  function orderProductsHtml(items) {
    if (!items || !items.length) {
      return '<div class="empty-state">Aucun article trouvé pour cette commande.</div>';
    }
    return '<div class="order-products">' + items.map(function (item) {
      var image = item.image ? ' style="background-image:url(' + JSON.stringify(item.image).slice(1, -1) + ')"' : '';
      return ''
        + '<div class="order-product">'
        +   '<div class="order-product__img"' + image + '></div>'
        +   '<div>'
        +     '<div class="order-product__name">' + escapeHtml(item.name) + '</div>'
        +     '<div class="order-product__meta">Quantité : ' + escapeHtml(item.qty) + '</div>'
        +   '</div>'
        +   '<div class="order-product__price">' + escapeHtml(fmtCurrency(item.price)) + '</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function ordersHtml(orders) {
    if (!orders || !orders.length) {
      return '<div class="empty-state"><h3 style="margin:0 0 8px;color:var(--brown-deep);">Aucune commande pour le moment.</h3><p style="margin:0;">Vos prochaines commandes apparaitront ici, avec leur statut et leur suivi.</p></div>';
    }
    return '<div class="orders-list">' + orders.map(function (order) {
      return ''
        + '<article class="order-item">'
        +   '<div class="order-item__head">'
        +     '<div>'
        +       '<div class="order-item__ref">Commande ' + escapeHtml(order.id) + '</div>'
        +       '<div class="order-item__date">Passée le ' + escapeHtml(fmtDate(order.createdAt)) + '</div>'
        +     '</div>'
        +     '<div class="order-item__status">' + escapeHtml(order.statusLabel || order.status) + '</div>'
        +   '</div>'
        +   '<div class="order-item__body">'
        +     '<div class="order-item__totals">'
        +       '<div class="order-item__total">Total <strong>' + escapeHtml(fmtCurrency(order.total)) + '</strong></div>'
        +       '<div class="order-item__total">Paiement <strong>' + escapeHtml(order.paidAt ? 'validé' : 'en attente') + '</strong></div>'
        +       (order.sendcloud && order.sendcloud.trackingNumber ? '<div class="order-item__total">Suivi <strong>' + escapeHtml(order.sendcloud.trackingNumber) + '</strong></div>' : '')
        +     '</div>'
        +     orderProductsHtml(order.items)
        +     (order.sendcloud && order.sendcloud.labelUrl ? '<a class="tracking-link" href="' + escapeHtml(order.sendcloud.labelUrl) + '" target="_blank" rel="noopener">Voir le suivi / etiquette</a>' : '')
        +   '</div>'
        + '</article>';
    }).join('') + '</div>';
  }

  function renderAccount(data) {
    var user = data.user || {};
    var orders = data.orders || [];
    var stats = data.stats || {};
    var latestOrder = orders[0] || null;

    root.innerHTML = ''
      + '<section class="account-hero">'
      +   '<div class="account-hero__intro">'
      +     '<div class="account-hero__eyebrow">Espace client Castaneas</div>'
      +     '<h1 class="account-hero__title">Bonjour ' + escapeHtml(user.prenom || 'à vous') + ',<br><em>heureux de vous revoir.</em></h1>'
      +     '<div class="account-hero__text">Retrouvez vos commandes, vos informations et votre historique dans un seul espace clair et pratique.</div>'
      +     '<div class="account-hero__meta">'
      +       '<div class="meta-pill">' + escapeHtml(user.email || '') + '</div>'
      +       (latestOrder ? '<div class="meta-pill">Dernière commande ' + escapeHtml(latestOrder.id) + '</div>' : '<div class="meta-pill">Aucune commande pour le moment</div>')
      +     '</div>'
      +   '</div>'
      +   '<div class="account-hero__summary">'
      +     '<div class="section-eyebrow" style="color:rgba(255,255,255,.7)">Votre tableau de bord</div>'
      +     '<h2>Un compte client simple, utile et complet.</h2>'
      +     '<div class="summary-stats">'
      +       '<div class="summary-stat"><div class="summary-stat__label">Commandes</div><span class="summary-stat__value">' + escapeHtml(stats.ordersCount || 0) + '</span></div>'
      +       '<div class="summary-stat"><div class="summary-stat__label">Total depense</div><span class="summary-stat__value">' + escapeHtml(fmtCurrency(stats.lifetimeValue || 0)) + '</span></div>'
      +     '</div>'
      +     '<div class="summary-actions">'
      +       '<a href="/facturation" class="summary-btn">Nouvelle commande</a>'
      +       '<button class="summary-btn summary-btn--ghost" id="account-logout">Déconnexion</button>'
      +     '</div>'
      +   '</div>'
      + '</section>'
      + '<section class="account-grid">'
      +   '<div>'
      +     '<div class="account-card">'
      +       '<div class="section-eyebrow">Profil</div>'
      +       '<h2 class="section-title">Vos informations</h2>'
      +       '<p class="section-sub">Mettez à jour votre nom de contact. Votre adresse e-mail reste votre identifiant de connexion.</p>'
      +       '<form id="profile-form">'
      +         '<div class="form-grid">'
      +           '<div class="form-group"><label for="account-prenom">Prénom</label><input id="account-prenom" class="form-control" value="' + escapeHtml(user.prenom || '') + '"></div>'
      +           '<div class="form-group"><label for="account-nom">Nom</label><input id="account-nom" class="form-control" value="' + escapeHtml(user.nom || '') + '"></div>'
      +           '<div class="form-group span2"><label for="account-email">Adresse e-mail</label><input id="account-email" class="form-control" value="' + escapeHtml(user.email || '') + '" readonly></div>'
      +         '</div>'
      +         '<div class="form-actions"><button class="btn-account btn-account--primary" type="submit">Enregistrer mon profil</button></div>'
      +         '<div class="inline-message" id="profile-message"></div>'
      +       '</form>'
      +     '</div>'
      +     '<div class="account-card">'
      +       '<div class="section-eyebrow">Sécurité</div>'
      +       '<h2 class="section-title">Changer le mot de passe</h2>'
      +       '<p class="section-sub">Choisissez un nouveau mot de passe robuste pour sécuriser votre compte client.</p>'
      +       '<form id="password-form">'
      +         '<div class="form-grid">'
      +           '<div class="form-group span2"><label for="current-password">Mot de passe actuel</label><input id="current-password" type="password" class="form-control" autocomplete="current-password"></div>'
      +           '<div class="form-group span2"><label for="new-password">Nouveau mot de passe</label><input id="new-password" type="password" class="form-control" autocomplete="new-password"></div>'
      +         '</div>'
      +         '<div class="form-actions"><button class="btn-account btn-account--secondary" type="submit">Mettre à jour</button></div>'
      +         '<div class="inline-message" id="password-message"></div>'
      +       '</form>'
      +     '</div>'
      +     '<div class="account-card">'
      +       '<div class="section-eyebrow">Historique</div>'
      +       '<h2 class="section-title">Vos commandes</h2>'
      +       '<p class="section-sub">Suivez vos achats, leurs statuts et les produits associés.</p>'
      +       '<div id="orders-list">' + ordersHtml(orders) + '</div>'
      +     '</div>'
      +   '</div>'
      +   '<div>'
      +     '<div class="account-card">'
      +       '<div class="section-eyebrow">Carnet</div>'
      +       '<h2 class="section-title">Vos adresses</h2>'
      +       '<p class="section-sub">Nous reprenons vos dernières informations de facturation et de livraison pour vous faire gagner du temps.</p>'
      +       '<div class="address-stack">'
      +         '<div class="address-box"><div class="address-box__title">Facturation</div>' + addressHtml(data.addresses && data.addresses.billing, 'Aucune adresse de facturation connue pour le moment.') + '</div>'
      +         '<div class="address-box"><div class="address-box__title">Livraison</div>' + addressHtml(data.addresses && data.addresses.shipping, 'Aucune adresse de livraison connue pour le moment.') + '</div>'
      +       '</div>'
      +     '</div>'
      +     '<div class="account-card">'
      +       '<div class="section-eyebrow">Besoin d’aide</div>'
      +       '<h2 class="section-title">Votre relation Castaneas</h2>'
      +       '<p class="section-sub">Pour toute question sur une commande, une adresse ou un paiement, contactez-nous depuis votre dernière commande ou directement via notre page contact.</p>'
      +       '<div class="form-actions"><a class="btn-account btn-account--primary" href="/facturation">Commander à nouveau</a><a class="btn-account btn-account--secondary" href="/histoire">Notre histoire</a></div>'
      +     '</div>'
      +   '</div>'
      + '</section>';

    document.getElementById('account-logout').addEventListener('click', async function () {
      try { await CastaneasAuth.logout(); } catch (e) {}
      window.location.href = '/connexion';
    });

    document.getElementById('profile-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var message = document.getElementById('profile-message');
      message.className = 'inline-message';
      message.textContent = 'Enregistrement…';
      try {
        var response = await fetch('auth.php?action=update_profile', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prenom: document.getElementById('account-prenom').value.trim(),
            nom: document.getElementById('account-nom').value.trim()
          })
        });
        var payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.message || 'Erreur de mise à jour.');
        if (payload.user) CastaneasAuth.cacheSession(payload.user);
        message.className = 'inline-message success';
        message.textContent = payload.message || 'Profil mis à jour.';
      } catch (error) {
        message.className = 'inline-message error';
        message.textContent = error && error.message ? error.message : 'Mise à jour impossible.';
      }
    });

    document.getElementById('password-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var message = document.getElementById('password-message');
      message.className = 'inline-message';
      message.textContent = 'Mise à jour…';
      try {
        var response = await fetch('auth.php?action=change_password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: document.getElementById('current-password').value,
            newPassword: document.getElementById('new-password').value
          })
        });
        var payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.message || 'Erreur de mise à jour.');
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        message.className = 'inline-message success';
        message.textContent = payload.message || 'Mot de passe mis à jour.';
      } catch (error) {
        message.className = 'inline-message error';
        message.textContent = error && error.message ? error.message : 'Mise à jour impossible.';
      }
    });
  }

  async function loadAccount() {
    try {
      var session = await CastaneasAuth.fetchSession();
      if (!session || !session.email) {
        window.location.href = '/connexion?redirect=' + encodeURIComponent('/mon-compte');
        return;
      }

      var response = await fetch('auth.php?action=account', {
        method: 'GET',
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' }
      });
      var payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.message || 'Impossible de charger votre espace client.');
      }
      renderAccount(payload);
    } catch (error) {
      root.innerHTML = '<div class="empty-state"><h2 style="margin:0 0 10px;color:var(--brown-deep);">Impossible d’ouvrir votre espace client.</h2><p style="margin:0 0 18px;">' + escapeHtml(error && error.message ? error.message : 'Erreur inattendue.') + '</p><a class="btn-account btn-account--primary" href="/connexion?redirect=%2Fmon-compte">Se connecter</a></div>';
    }
  }

  loadAccount();
})();
</script>
</body>
</html>
