name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-use-ccc true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ftp:ignore-pasv-address true
          set ftp:sync-mode true
          set ssl:verify-certificate no
          set net:timeout 20
          set net:idle 20
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:timeout 120
          set xfer:clobber true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER"
          mirror -R ./ /public_html/ \
            --verbose=3 \
            --parallel=1 \
            --max-errors=1 \
            --only-newer \
            --continue \
            --no-perms \
            --exclude-glob .git* \
            --exclude-glob .github* \
            --exclude-glob "db-config.local.php" \
            --exclude-glob node_modules \
            --exclude-glob "uploads/**" \
            --exclude-glob "data/*.json"
          bye
          EOF
