name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        timeout-minutes: 15
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ftp_curl() {
            curl \
              --fail \
              --silent \
              --show-error \
              --ipv4 \
              --ssl-reqd \
              --insecure \
              --ftp-pasv \
              --disable-epsv \
              --ftp-create-dirs \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 180 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "$@"
          }

          encode_remote_path() {
            local value="$1"
            value=${value//%/%25}
            value=${value// /%20}
            value=${value//#/%23}
            value=${value//\?/%3F}
            value=${value//\[/%5B}
            value=${value//\]/%5D}
            printf '%s' "$value"
          }

          detect_remote_base() {
            local candidate
            local listing

            for candidate in "" "public_html"; do
              local probe_path="$candidate"
              if listing=$(ftp_curl --list-only "ftp://$FTP_SERVER/$probe_path" 2>/dev/null); then
                if printf '%s\n' "$listing" | grep -E '^(index\.html|Accueil\.html|Fiche Produit\.html|assets|styles\.css)$' >/dev/null; then
                  printf '%s' "$candidate"
                  return 0
                fi
              fi
            done

            printf ''
          }

          REMOTE_BASE=$(detect_remote_base)
          if [ -n "$REMOTE_BASE" ]; then
            echo "Detected remote base: $REMOTE_BASE"
          else
            echo "Detected remote base: FTP root"
          fi

          upload_file() {
            local file="$1"
            local remote_path
            if [ -n "$REMOTE_BASE" ]; then
              remote_path=$(encode_remote_path "$REMOTE_BASE/$file")
            else
              remote_path=$(encode_remote_path "$file")
            fi

            echo "Uploading $file"

            ftp_curl \
              --upload-file "$file" \
              "ftp://$FTP_SERVER/$remote_path"
          }

          while IFS= read -r file; do
            case "$file" in
              .git*|.github*|db-config.local.php|node_modules/*|uploads/*|data/*.json)
                continue
                ;;
            esac

            upload_file "$file"
          done < <(git ls-files)
