name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        timeout-minutes: 15
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          encode_remote_path() {
            local value="$1"
            value=${value//%/%25}
            value=${value// /%20}
            value=${value//#/%23}
            value=${value//\?/%3F}
            value=${value//\[/%5B}
            value=${value//\]/%5D}
            printf '%s' "$value"
          }

          upload_file() {
            local file="$1"
            local remote_path
            remote_path=$(encode_remote_path "/public_html/$file")

            echo "Uploading $file"

            curl \
              --fail \
              --silent \
              --show-error \
              --ipv4 \
              --ssl-reqd \
              --insecure \
              --ftp-pasv \
              --disable-epsv \
              --ftp-create-dirs \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 180 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
                "ftp://$FTP_SERVER$remote_path"
          }

          while IFS= read -r file; do
            case "$file" in
              .git*|.github*|db-config.local.php|node_modules/*|uploads/*|data/*.json)
                continue
                ;;
            esac

            upload_file "$file"
          done < <(git ls-files)
