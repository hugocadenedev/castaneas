name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS
        timeout-minutes: 35
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          lftp_exec() {
            local commands="$1"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set cmd:fail-exit true; set net:timeout 45; set net:max-retries 2; set net:reconnect-interval-base 5; set net:reconnect-interval-max 30; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false; set ftp:passive-mode true; set ftp:prefer-epsv false; set xfer:clobber true; $commands; bye"
          }

          detect_remote_base() {
            local candidate
            local listing

            for candidate in "" "public_html"; do
              local probe_path="/${candidate}"
              if [ "$candidate" = "" ]; then
                probe_path="/"
              fi

              if listing=$(lftp_exec "cls -1 $probe_path" 2>/dev/null); then
                if printf '%s\n' "$listing" | grep -E '^(index\.html|Accueil\.html|Fiche Produit\.html|assets|styles\.css)$' >/dev/null; then
                  printf '%s' "$candidate"
                  return 0
                fi
              fi
            done

            printf ''
          }

          REMOTE_BASE=$(detect_remote_base)
          if [ -n "$REMOTE_BASE" ]; then
            echo "Detected remote base: $REMOTE_BASE"
          else
            echo "Detected remote base: FTP root"
          fi

          DEPLOY_DIR="$RUNNER_TEMP/hostinger-deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          rsync -a \
            --prune-empty-dirs \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='db-config.local.php' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='data/*.json' \
            --exclude='data/' \
            --exclude='storage/' \
            ./ "$DEPLOY_DIR/"

          REMOTE_TARGET="."
          if [ -n "$REMOTE_BASE" ]; then
            REMOTE_TARGET="$REMOTE_BASE"
          fi

          echo "Mirroring $DEPLOY_DIR to $REMOTE_TARGET"
          if [ -n "$REMOTE_BASE" ]; then
            lftp_exec "mkdir -p $REMOTE_TARGET; mirror -R --only-newer --verbose=1 --parallel=4 $DEPLOY_DIR $REMOTE_TARGET"
          else
            lftp_exec "mirror -R --only-newer --verbose=1 --parallel=4 $DEPLOY_DIR $REMOTE_TARGET"
          fi
