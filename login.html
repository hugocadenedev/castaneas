<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · Castaneas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
<style>
  :root {
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, Arial, sans-serif;
  }
  body { font-family: var(--sans); }
  h1,h2,h3 { font-family: var(--serif); }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="/accueil" class="auth-logo">
      <img src="assets/Castaneas-logo (3).svg" alt="Castaneas" style="height:44px;width:auto;">
    </a>

    <h1 class="auth-title">Bienvenue</h1>
    <p class="auth-subtitle">Connectez-vous à votre compte Castaneas</p>

    <div class="auth-alert" id="auth-alert" style="display:none;"></div>

    <form class="auth-form" id="login-form" novalidate>
      <div class="auth-field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email">
        <span class="auth-error" id="err-email"></span>
      </div>
      <div class="auth-field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        <span class="auth-error" id="err-password"></span>
      </div>
      <button type="submit" class="auth-submit" id="submit-btn">Se connecter</button>
    </form>

    <div class="auth-divider">
      <span>Pas encore de compte ?</span>
      <a href="/inscription">Créer un compte</a>
    </div>
  </div>
</div>

<script src="auth-client.js"></script>
<script>
function showError(fieldId, msg) {
  const el = document.getElementById(fieldId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearErrors() {
  document.querySelectorAll('.auth-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
  const alert = document.getElementById('auth-alert');
  alert.style.display = 'none';
  alert.textContent = '';
}
function showAlert(msg) {
  const alert = document.getElementById('auth-alert');
  alert.textContent = msg;
  alert.style.display = 'block';
}

function getSafeRedirect() {
  const raw = new URLSearchParams(location.search).get('redirect') || '/mon-compte';
  return /^https?:\/\/|^\/\//.test(raw) ? '/accueil' : raw;
}

(async function syncExistingSession() {
  try {
    const session = await CastaneasAuth.fetchSession();
    if (session && session.email) {
      window.location.href = getSafeRedirect();
    }
  } catch (_) {}
})();

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearErrors();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  let valid = true;

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('err-email', 'Veuillez entrer un e-mail valide.');
    valid = false;
  }
  if (!password || password.length < 6) {
    showError('err-password', 'Mot de passe requis (6 caractères min).');
    valid = false;
  }
  if (!valid) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  const previousText = btn.textContent;
  btn.textContent = 'Connexion…';

  try {
    await CastaneasAuth.login(email, password);
  } catch (error) {
    btn.disabled = false;
    btn.textContent = previousText;
    showAlert(error && error.message ? error.message : 'Connexion impossible.');
    return;
  }

  btn.textContent = '✓ Connecté !';

  setTimeout(() => {
    window.location.href = getSafeRedirect();
  }, 700);
});
</script>
<script src="data.php?v=2"></script><script src="site-data.js?v=6"></script>
</body>
</html>
